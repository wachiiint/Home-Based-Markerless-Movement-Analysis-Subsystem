[project]
name = "rtmpose-movement-analysis-service"
version = "0.1.0"
description = "Local FastAPI RTMPose movement analysis service compatible with the MediaPipe assessment contract."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "opencv-contrib-python>=4.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "rtmlib>=0.0.13",
    "onnxruntime>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
